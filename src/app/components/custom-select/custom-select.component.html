<div class="custom-select">
    <div class="select-selected" (click)="toggleDropdown()" [class.select-arrow-active]="dropdownOpen">
      {{ selectedOption() || 'Select role' }}
    </div>
    <div class="select-items" [class.select-hide]="!dropdownOpen">
        @for(option of options(); track option) {
            <div (click)="selectOption(option)" [class.same-as-selected]="option === selectedOption()">
                {{ option }}
            </div>
        }
    </div>
</div>
